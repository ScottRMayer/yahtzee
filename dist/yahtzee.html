<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A Yahtzee scorecard that adds everything up for you.">
<meta name="theme-color" content="#111827">
<title>Yahtzee Scorecard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e11d48'/><g fill='white'><circle cx='30' cy='30' r='9'/><circle cx='70' cy='30' r='9'/><circle cx='50' cy='50' r='9'/><circle cx='30' cy='70' r='9'/><circle cx='70' cy='70' r='9'/></g></svg>">
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f5;
  --surface: #ffffff;
  --surface-alt: #fafafa;
  --line: #e4e4e7;
  --line-strong: #d4d4d8;
  --text: #18181b;
  --muted: #71717a;
  --accent: #e11d48;
  --accent-soft: #ffe4e6;
  --good: #15803d;
  --good-soft: #dcfce7;
  --total-bg: #f4f4f5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .06);
  --radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #09090b;
    --surface: #18181b;
    --surface-alt: #1f1f23;
    --line: #27272a;
    --line-strong: #3f3f46;
    --text: #fafafa;
    --muted: #a1a1aa;
    --accent: #fb7185;
    --accent-soft: #4c0519;
    --good: #4ade80;
    --good-soft: #052e16;
    --total-bg: #202024;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

/*
 * The page is a column: a fixed top bar, then the scorecard, which shrinks and
 * scrolls inside itself when the screen is short. That keeps the player names
 * and category names pinned to the edges of the card while scrolling.
 */
body {
  margin: 0;
  padding: 0 0 max(1rem, env(safe-area-inset-bottom));
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  height: 100vh;
  height: 100dvh;   /* keeps the frame inside a mobile browser's chrome */
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- top bar ---------- */

.topbar {
  flex: 0 0 auto;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  flex-wrap: wrap;
  padding: .75rem 1rem calc(.75rem + env(safe-area-inset-top)) 1rem;
  padding-top: calc(.75rem + env(safe-area-inset-top));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.topbar h1 {
  margin: 0;
  font-size: 1.15rem;
  letter-spacing: -.01em;
}

.progress {
  margin: .1rem 0 0;
  font-size: .78rem;
  color: var(--muted);
}

.topbar-actions {
  display: flex;
  gap: .5rem;
}

.btn {
  appearance: none;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-size: .88rem;
  font-weight: 600;
  padding: .5rem .8rem;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
}

@media (prefers-color-scheme: dark) {
  .btn { color: #1f0510; }
}

.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-quiet {
  background: transparent;
  border-color: var(--line-strong);
  color: var(--text);
  font-weight: 500;
}

.btn:focus-visible,
.cell:focus-visible,
.opt:focus-visible,
.name-input:focus-visible,
.step:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- scorecard ---------- */

main {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 1rem;
}

.card-scroll {
  /* Sized by content, but shrinks and scrolls rather than pushing the page. */
  flex: 0 1 auto;
  min-height: 0;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  -webkit-overflow-scrolling: touch;
}

.scorecard {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  font-variant-numeric: tabular-nums;
}

.scorecard th,
.scorecard td {
  border-bottom: 1px solid var(--line);
  padding: 0;
  text-align: center;
}

.scorecard tbody:last-child tr:last-child th,
.scorecard tbody:last-child tr:last-child td {
  border-bottom: 0;
}

/* First column: category names, pinned while scrolling sideways. */
.row-head {
  position: sticky;
  left: 0;
  z-index: 10;
  background: var(--surface);
  text-align: left;
  padding: .5rem .7rem;
  min-width: 9.5rem;
  border-right: 1px solid var(--line-strong);
  font-weight: 600;
  font-size: .9rem;
}

.row-head .hint {
  display: block;
  font-weight: 400;
  font-size: .72rem;
  color: var(--muted);
}

/* Header row: player names, pinned while scrolling down. */
.scorecard thead th {
  position: sticky;
  top: 0;
  z-index: 15;
  background: var(--surface-alt);
  border-bottom: 1px solid var(--line-strong);
  padding: .45rem .35rem;
}

.scorecard thead th.row-head {
  z-index: 20;
  background: var(--surface-alt);
}

.player-col { min-width: 5.5rem; }

.player-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .15rem;
}

.name-input {
  /* Width comes from the size attribute so the field hugs the name. */
  flex: 0 1 auto;
  min-width: 2.5rem;
  max-width: 100%;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: .88rem;
  font-weight: 600;
  text-align: center;
  padding: .3rem .2rem;
}

.name-input:hover { border-color: var(--line-strong); }
.name-input:focus { border-color: var(--accent); outline: none; background: var(--surface); }

.remove-player {
  flex: 0 0 auto;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1;
  padding: .25rem;
  border-radius: 6px;
  cursor: pointer;
}

.remove-player:hover { color: var(--accent); }

.section-label th {
  background: var(--surface-alt);
  color: var(--muted);
  text-align: left;
  font-size: .7rem;
  letter-spacing: .09em;
  text-transform: uppercase;
  padding: .45rem .7rem;
}

/* Score boxes */
.cell {
  display: block;
  width: 100%;
  min-height: 2.6rem;
  border: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
  padding: .5rem .3rem;
  cursor: pointer;
}

.cell:hover { background: var(--surface-alt); }
.cell.filled { font-weight: 600; }
.cell.scratched { color: var(--muted); }

.cell.empty::after {
  content: "–";
  color: var(--line-strong);
}

/* Computed rows */
.total-row td,
.total-row th {
  background: var(--total-bg);
  font-weight: 600;
}

.total-row .row-head { background: var(--total-bg); }

.total-value {
  display: block;
  padding: .5rem .3rem;
  font-size: .95rem;
}

.total-value .sub {
  display: block;
  font-size: .68rem;
  font-weight: 500;
  color: var(--muted);
}

.bonus-earned { color: var(--good); }

.grand-row td,
.grand-row th {
  background: var(--accent-soft);
  border-top: 2px solid var(--accent);
}

.grand-row .row-head { background: var(--accent-soft); }
.grand-row .total-value { font-size: 1.25rem; font-weight: 700; }

.leader .total-value::after {
  content: " 👑";
  font-size: .9rem;
}

/* Yahtzee bonus stepper */
.stepper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .2rem;
  padding: .35rem .2rem;
}

.step {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--text);
  width: 1.7rem;
  height: 1.7rem;
  border-radius: 50%;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.step:disabled { opacity: .3; cursor: not-allowed; }

.bonus-count {
  min-width: 2.6rem;
  font-weight: 600;
  font-size: .9rem;
}

.tip {
  flex: 0 0 auto;
  max-width: 34rem;
  margin: .9rem auto 0;
  color: var(--muted);
  font-size: .8rem;
  text-align: center;
}

/* ---------- entry sheet ---------- */

.sheet {
  border: 0;
  padding: 0;
  background: transparent;
  width: min(30rem, 100%);
  max-width: 100%;
  margin: auto auto 0;
  color: var(--text);
}

.sheet::backdrop { background: rgba(0, 0, 0, .5); }

/*
 * Fallback for hosts that block modal dialogs (a sandboxed frame without
 * allow-modals). showModal() is refused there, so the sheet opens non-modally
 * and takes its own fixed position and scrim instead of the top layer's.
 */
.sheet.no-modal {
  position: fixed;
  inset: auto 0 0 0;
  top: auto;
  z-index: 60;
}

.scrim {
  position: fixed;
  inset: 0;
  z-index: 55;
  background: rgba(0, 0, 0, .5);
}

.scrim[hidden] { display: none; }

.confirm-actions {
  display: flex;
  gap: .6rem;
  margin-top: 1rem;
}

.confirm-actions .btn { flex: 1 1 0; }

.sheet-form {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
  max-height: 85vh;
  overflow-y: auto;
}

@media (min-width: 40rem) {
  .sheet { margin: auto; }
  .sheet-form { border-radius: var(--radius); }
}

.sheet-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: .9rem;
}

.sheet-head h2 { margin: 0; font-size: 1.05rem; }
.sheet-sub { margin: .15rem 0 0; color: var(--muted); font-size: .82rem; }

.options {
  display: grid;
  gap: .5rem;
  grid-template-columns: repeat(auto-fill, minmax(4.2rem, 1fr));
}

.options.wide { grid-template-columns: 1fr 1fr; }

/* Dice totals are bare numbers, so they pack tighter. */
.options.compact { grid-template-columns: repeat(auto-fill, minmax(3.1rem, 1fr)); }
.options.compact .opt { min-height: 2.7rem; padding: .55rem .3rem; }

.opt {
  border: 1px solid var(--line-strong);
  background: var(--surface-alt);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  padding: .7rem .4rem;
  border-radius: 10px;
  cursor: pointer;
  min-height: 3rem;
}

.opt:hover { border-color: var(--accent); }

.opt .opt-sub {
  display: block;
  font-size: .68rem;
  font-weight: 500;
  color: var(--muted);
}

.opt.current {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.opt.zero {
  color: var(--muted);
}

.sheet-foot {
  display: flex;
  justify-content: flex-end;
  margin-top: .9rem;
}

.sheet-foot .btn { width: 100%; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <h1>Yahtzee</h1>
    <p id="progress" class="progress">&nbsp;</p>
  </div>
  <div class="topbar-actions">
    <button type="button" id="add-player" class="btn">+ Player</button>
    <button type="button" id="new-game" class="btn btn-quiet">New game</button>
  </div>
</header>

<main>
  <div class="card-scroll">
    <table class="scorecard" id="scorecard">
      <caption class="visually-hidden">Yahtzee scorecard. Choose a box to enter a score.</caption>
    </table>
  </div>

  <p class="tip">Tap any box to enter a score. Totals, the 63-point bonus and Yahtzee bonuses are worked out for you. Your game is saved on this device.</p>
</main>

<dialog id="entry" class="sheet" aria-labelledby="entry-title">
  <form method="dialog" class="sheet-form">
    <div class="sheet-head">
      <div>
        <h2 id="entry-title">Category</h2>
        <p id="entry-sub" class="sheet-sub">Player</p>
      </div>
      <button type="button" class="btn btn-quiet sheet-close" data-close aria-label="Close">Close</button>
    </div>
    <div id="entry-options" class="options"></div>
    <div class="sheet-foot">
      <button type="button" id="entry-clear" class="btn btn-quiet">Clear box</button>
    </div>
  </form>
</dialog>

<dialog id="confirm" class="sheet" aria-labelledby="confirm-title">
  <div class="sheet-form">
    <h2 id="confirm-title">Are you sure?</h2>
    <p id="confirm-text" class="sheet-sub"></p>
    <div class="confirm-actions">
      <button type="button" id="confirm-cancel" class="btn btn-quiet">Cancel</button>
      <button type="button" id="confirm-ok" class="btn">Confirm</button>
    </div>
  </div>
</dialog>

<div id="scrim" class="scrim" hidden></div>

<script>
/*
 * Yahtzee scoring rules.
 *
 * Pure functions, no DOM. Loaded by the browser via a plain <script> tag and
 * by the test suite via require(), so it must stay dependency-free.
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) {
    module.exports = api;
  } else {
    root.Scoring = api;
  }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var UPPER_BONUS_THRESHOLD = 63;
  var UPPER_BONUS = 35;
  var YAHTZEE_BONUS = 100;
  var MAX_YAHTZEE_BONUS = 13;

  // A hand is five dice, so any "add up the dice" category lands between
  // 5 (all ones) and 30 (all sixes).
  var MIN_DICE_TOTAL = 5;
  var MAX_DICE_TOTAL = 30;

  var CATEGORIES = [
    { id: 'ones', section: 'upper', label: 'Aces', hint: 'Total of all 1s', face: 1 },
    { id: 'twos', section: 'upper', label: 'Twos', hint: 'Total of all 2s', face: 2 },
    { id: 'threes', section: 'upper', label: 'Threes', hint: 'Total of all 3s', face: 3 },
    { id: 'fours', section: 'upper', label: 'Fours', hint: 'Total of all 4s', face: 4 },
    { id: 'fives', section: 'upper', label: 'Fives', hint: 'Total of all 5s', face: 5 },
    { id: 'sixes', section: 'upper', label: 'Sixes', hint: 'Total of all 6s', face: 6 },
    { id: 'threeKind', section: 'lower', label: 'Three of a Kind', hint: 'Total of all 5 dice', kind: 'sum' },
    { id: 'fourKind', section: 'lower', label: 'Four of a Kind', hint: 'Total of all 5 dice', kind: 'sum' },
    { id: 'fullHouse', section: 'lower', label: 'Full House', hint: '3 of a kind + a pair', kind: 'fixed', value: 25 },
    { id: 'smallStraight', section: 'lower', label: 'Small Straight', hint: '4 in a row', kind: 'fixed', value: 30 },
    { id: 'largeStraight', section: 'lower', label: 'Large Straight', hint: '5 in a row', kind: 'fixed', value: 40 },
    { id: 'yahtzee', section: 'lower', label: 'Yahtzee', hint: '5 of a kind', kind: 'fixed', value: 50 },
    { id: 'chance', section: 'lower', label: 'Chance', hint: 'Total of all 5 dice', kind: 'sum' }
  ];

  var BY_ID = {};
  CATEGORIES.forEach(function (category) {
    BY_ID[category.id] = category;
  });

  var UPPER = CATEGORIES.filter(function (c) { return c.section === 'upper'; });
  var LOWER = CATEGORIES.filter(function (c) { return c.section === 'lower'; });

  function getCategory(id) {
    return BY_ID[id] || null;
  }

  function range(from, to) {
    var out = [];
    for (var n = from; n <= to; n++) out.push(n);
    return out;
  }

  /**
   * Every score that is legally reachable in a category, always including 0
   * (a scratched box). The entry UI is built from this, so a value the rules
   * can't produce can never be typed in.
   */
  function validValues(id) {
    var category = getCategory(id);
    if (!category) return [];
    if (category.section === 'upper') {
      // Zero through five dice showing that face.
      return range(0, 5).map(function (count) { return count * category.face; });
    }
    if (category.kind === 'fixed') return [0, category.value];
    return [0].concat(range(MIN_DICE_TOTAL, MAX_DICE_TOTAL));
  }

  function isValidValue(id, value) {
    return validValues(id).indexOf(value) !== -1;
  }

  function isFilled(value) {
    return typeof value === 'number' && isFinite(value);
  }

  function sumSection(scores, categories) {
    return categories.reduce(function (total, category) {
      var value = scores ? scores[category.id] : undefined;
      return isFilled(value) ? total + value : total;
    }, 0);
  }

  function countFilled(scores, categories) {
    return categories.reduce(function (count, category) {
      var value = scores ? scores[category.id] : undefined;
      return isFilled(value) ? count + 1 : count;
    }, 0);
  }

  function clampBonusCount(count) {
    if (typeof count !== 'number' || !isFinite(count)) return 0;
    return Math.max(0, Math.min(MAX_YAHTZEE_BONUS, Math.floor(count)));
  }

  /**
   * Totals for one player's card.
   *
   * card: { scores: { [categoryId]: number }, yahtzeeBonus: number }
   * An absent or null score means the box has not been played yet.
   */
  function scoreCard(card) {
    var scores = (card && card.scores) || {};
    var upperSubtotal = sumSection(scores, UPPER);
    var bonusEarned = upperSubtotal >= UPPER_BONUS_THRESHOLD;
    var upperBonus = bonusEarned ? UPPER_BONUS : 0;
    var bonusCount = clampBonusCount(card && card.yahtzeeBonus);
    var yahtzeeBonusPoints = bonusCount * YAHTZEE_BONUS;
    var lowerSubtotal = sumSection(scores, LOWER);
    var lowerTotal = lowerSubtotal + yahtzeeBonusPoints;
    var boxesFilled = countFilled(scores, CATEGORIES);

    return {
      upperSubtotal: upperSubtotal,
      upperBonus: upperBonus,
      bonusEarned: bonusEarned,
      // How many upper-section points are still needed for the 35 bonus.
      pointsToBonus: bonusEarned ? 0 : UPPER_BONUS_THRESHOLD - upperSubtotal,
      upperTotal: upperSubtotal + upperBonus,
      lowerSubtotal: lowerSubtotal,
      yahtzeeBonusCount: bonusCount,
      yahtzeeBonusPoints: yahtzeeBonusPoints,
      lowerTotal: lowerTotal,
      grandTotal: upperSubtotal + upperBonus + lowerTotal,
      boxesFilled: boxesFilled,
      boxesTotal: CATEGORIES.length,
      complete: boxesFilled === CATEGORIES.length
    };
  }

  /**
   * Indexes of the winning cards: highest grand total, and every card tied
   * with it. Returns [] until all cards are complete.
   */
  function findLeaders(cards) {
    if (!cards || !cards.length) return [];
    var totals = cards.map(function (card) { return scoreCard(card); });
    var allComplete = totals.every(function (t) { return t.complete; });
    if (!allComplete) return [];
    var best = Math.max.apply(null, totals.map(function (t) { return t.grandTotal; }));
    var leaders = [];
    totals.forEach(function (t, index) {
      if (t.grandTotal === best) leaders.push(index);
    });
    return leaders;
  }

  return {
    CATEGORIES: CATEGORIES,
    UPPER: UPPER,
    LOWER: LOWER,
    UPPER_BONUS: UPPER_BONUS,
    UPPER_BONUS_THRESHOLD: UPPER_BONUS_THRESHOLD,
    YAHTZEE_BONUS: YAHTZEE_BONUS,
    MAX_YAHTZEE_BONUS: MAX_YAHTZEE_BONUS,
    getCategory: getCategory,
    validValues: validValues,
    isValidValue: isValidValue,
    isFilled: isFilled,
    scoreCard: scoreCard,
    findLeaders: findLeaders
  };
});
</script>
<script>
/*
 * Yahtzee scorecard UI.
 *
 * Renders one column per player, opens a picker of the legal scores when a box
 * is tapped, and recomputes every total from scoring.js after each change.
 */
(function () {
  'use strict';

  var STORAGE_KEY = 'yahtzee-scorecard-v1';
  var MAX_PLAYERS = 8;

  var state = { players: [] };
  var entry = null;      // { playerIndex, categoryId } while the sheet is open
  var focusAfterRender = null;

  var table = document.getElementById('scorecard');
  var sheet = document.getElementById('entry');
  var sheetTitle = document.getElementById('entry-title');
  var sheetSub = document.getElementById('entry-sub');
  var sheetOptions = document.getElementById('entry-options');
  var clearButton = document.getElementById('entry-clear');
  var progressLine = document.getElementById('progress');
  var confirmSheet = document.getElementById('confirm');
  var confirmTitle = document.getElementById('confirm-title');
  var confirmText = document.getElementById('confirm-text');
  var confirmOk = document.getElementById('confirm-ok');
  var confirmCancel = document.getElementById('confirm-cancel');
  var scrim = document.getElementById('scrim');

  /* ---------- dialogs ---------- */

  /**
   * Opens a sheet. A sandboxed frame without allow-modals refuses showModal(),
   * so fall back to a non-modal dialog with our own scrim — otherwise the
   * button would appear to do nothing at all.
   */
  function openDialog(dialog) {
    try {
      dialog.showModal();
      dialog.classList.remove('no-modal');
      return;
    } catch (err) {
      dialog.classList.add('no-modal');
      scrim.hidden = false;
      if (!dialog.open) dialog.show();
    }
  }

  function closeDialog(dialog) {
    if (dialog.open) dialog.close();
    dialog.classList.remove('no-modal');
    if (!sheet.open && !confirmSheet.open) scrim.hidden = true;
  }

  // Escape closes a modal dialog for free; a fallback one needs handling.
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    [sheet, confirmSheet].forEach(function (dialog) {
      if (dialog.open && dialog.classList.contains('no-modal')) closeDialog(dialog);
    });
  });

  var pendingConfirm = null;

  /**
   * Asks the question in-page rather than through window.confirm, which a
   * sandboxed frame answers "false" without ever showing the user anything.
   */
  function askConfirm(title, message, okLabel, onConfirm) {
    confirmTitle.textContent = title;
    confirmText.textContent = message;
    confirmOk.textContent = okLabel;
    pendingConfirm = onConfirm;
    openDialog(confirmSheet);
    confirmOk.focus();
  }

  function resolveConfirm(confirmed) {
    var action = pendingConfirm;
    pendingConfirm = null;
    closeDialog(confirmSheet);
    if (confirmed && action) action();
  }

  /* ---------- state ---------- */

  var nextId = 1;
  function newPlayer(name) {
    return { id: 'p' + nextId++, name: name, scores: {}, yahtzeeBonus: 0 };
  }

  function defaultState() {
    return { players: [newPlayer('Player 1'), newPlayer('Player 2')] };
  }

  function load() {
    var raw;
    try {
      raw = window.localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      return defaultState();   // private mode, storage disabled — play unsaved
    }
    if (!raw) return defaultState();

    try {
      var saved = JSON.parse(raw);
      if (!saved || !Array.isArray(saved.players) || !saved.players.length) return defaultState();

      var players = saved.players.slice(0, MAX_PLAYERS).map(function (stored, index) {
        var player = stored || {};
        var clean = newPlayer(typeof player.name === 'string' ? player.name : 'Player ' + (index + 1));
        var scores = player.scores || {};
        Scoring.CATEGORIES.forEach(function (category) {
          var value = scores[category.id];
          // Drop anything the rules can't produce rather than trusting storage.
          if (Scoring.isFilled(value) && Scoring.isValidValue(category.id, value)) {
            clean.scores[category.id] = value;
          }
        });
        clean.yahtzeeBonus = Scoring.scoreCard({ yahtzeeBonus: player.yahtzeeBonus }).yahtzeeBonusCount;
        return clean;
      });
      return { players: players };
    } catch (err) {
      return defaultState();
    }
  }

  function save() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      /* out of space or storage blocked — the game still plays, just unsaved */
    }
  }

  function commit() {
    save();
    render();
  }

  function anyScores() {
    return state.players.some(function (player) {
      return Scoring.scoreCard(player).boxesFilled > 0 || player.yahtzeeBonus > 0;
    });
  }

  /* ---------- dom helpers ---------- */

  function el(tag, props, children) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function (key) {
      if (key === 'class') node.className = props[key];
      else if (key === 'text') node.textContent = props[key];
      else if (key.slice(0, 2) === 'on') node.addEventListener(key.slice(2), props[key]);
      else if (props[key] !== null && props[key] !== undefined) node.setAttribute(key, props[key]);
    });
    (children || []).forEach(function (child) {
      if (child) node.appendChild(child);
    });
    return node;
  }

  /**
   * Tags a node with the player it belongs to and an aria-label template
   * holding a {name} slot, so renaming can refresh the label in place instead
   * of forcing a re-render that would interrupt typing.
   */
  function withLabel(props, player, template) {
    props['data-player-id'] = player.id;
    props['data-label-template'] = template;
    props['aria-label'] = template.replace('{name}', player.name);
    return props;
  }

  function refreshPlayerLabels(player) {
    var nodes = table.querySelectorAll('[data-player-id="' + player.id + '"][data-label-template]');
    Array.prototype.forEach.call(nodes, function (node) {
      var text = node.getAttribute('data-label-template').replace('{name}', player.name);
      node.setAttribute('aria-label', text);
      if (node.hasAttribute('title')) node.title = text;
    });
  }

  function categoryHead(category) {
    return el('th', { class: 'row-head', scope: 'row' }, [
      document.createTextNode(category.label),
      el('span', { class: 'hint', text: category.hint })
    ]);
  }

  function totalRow(label, values, options) {
    options = options || {};
    var row = el('tr', { class: 'total-row' + (options.rowClass ? ' ' + options.rowClass : '') });
    row.appendChild(el('th', { class: 'row-head', scope: 'row' }, [
      document.createTextNode(label),
      options.hint ? el('span', { class: 'hint', text: options.hint }) : null
    ]));
    values.forEach(function (value, index) {
      var cell = el('td', {});
      if (options.highlight && options.highlight.indexOf(index) !== -1) cell.className = 'leader';
      cell.appendChild(el('span', { class: 'total-value' + (value.className ? ' ' + value.className : '') }, [
        document.createTextNode(String(value.main)),
        value.sub ? el('span', { class: 'sub', text: value.sub }) : null
      ]));
      row.appendChild(cell);
    });
    return row;
  }

  function sectionLabelRow(label, columns) {
    var row = el('tr', { class: 'section-label' });
    row.appendChild(el('th', { colspan: columns + 1, scope: 'colgroup', text: label }));
    return row;
  }

  /* ---------- rendering ---------- */

  function render() {
    var players = state.players;
    var totals = players.map(function (player) { return Scoring.scoreCard(player); });
    var leaders = Scoring.findLeaders(players);

    table.textContent = '';
    table.appendChild(el('caption', { class: 'visually-hidden', text: 'Yahtzee scorecard' }));
    table.appendChild(renderHead(players));
    table.appendChild(renderSection(Scoring.UPPER, 'Upper section', players, totals, function (body) {
      body.appendChild(totalRow('Upper subtotal', totals.map(function (t) {
        return { main: t.upperSubtotal };
      })));
      body.appendChild(totalRow('Bonus', totals.map(function (t) {
        return t.bonusEarned
          ? { main: Scoring.UPPER_BONUS, sub: 'earned', className: 'bonus-earned' }
          : { main: 0, sub: t.pointsToBonus + ' to go' };
      }), { hint: '35 if subtotal reaches ' + Scoring.UPPER_BONUS_THRESHOLD }));
      body.appendChild(totalRow('Upper total', totals.map(function (t) {
        return { main: t.upperTotal };
      })));
    }));
    table.appendChild(renderSection(Scoring.LOWER, 'Lower section', players, totals, function (body) {
      body.appendChild(renderBonusRow(players, totals));
      body.appendChild(totalRow('Lower total', totals.map(function (t) {
        return { main: t.lowerTotal };
      })));
      body.appendChild(totalRow('Grand total', totals.map(function (t) {
        return { main: t.grandTotal };
      }), { rowClass: 'grand-row', highlight: leaders }));
    }));

    renderProgress(totals, leaders);
    document.getElementById('add-player').disabled = players.length >= MAX_PLAYERS;

    if (focusAfterRender) {
      var restore = table.querySelector('[data-focus-key="' + focusAfterRender + '"]');
      if (restore) restore.focus();
      focusAfterRender = null;
    }
  }

  function nameSize(name) {
    return Math.max(4, Math.min(14, (name || '').length + 1));
  }

  function renderHead(players) {
    var row = el('tr', {});
    row.appendChild(el('th', { class: 'row-head', scope: 'col', text: 'Category' }));

    players.forEach(function (player, index) {
      var remove = players.length > 1 ? el('button', withLabel({
        type: 'button',
        class: 'remove-player',
        title: 'Remove ' + player.name,
        onclick: function () { removePlayer(index); }
      }, player, 'Remove {name}'), [document.createTextNode('×')]) : null;

      var input = el('input', {
        class: 'name-input',
        type: 'text',
        value: player.name,
        maxlength: '14',
        size: nameSize(player.name),
        'aria-label': 'Name of player ' + (index + 1),
        oninput: function (event) {
          // Re-rendering here would steal focus mid-word, so patch the places
          // the name appears outside this input instead.
          player.name = event.target.value;
          event.target.size = nameSize(player.name);
          refreshPlayerLabels(player);
          refreshProgress();
          save();
        },
        onblur: function (event) {
          if (!event.target.value.trim()) {
            player.name = 'Player ' + (index + 1);
            commit();
          }
        }
      });

      var head = el('div', { class: 'player-head' }, [input, remove]);

      row.appendChild(el('th', { class: 'player-col', scope: 'col' }, [head]));
    });

    return el('thead', {}, [row]);
  }

  function renderSection(categories, label, players, totals, appendTotals) {
    var body = el('tbody', {});
    body.appendChild(sectionLabelRow(label, players.length));

    categories.forEach(function (category) {
      var row = el('tr', {});
      row.appendChild(categoryHead(category));
      players.forEach(function (player, playerIndex) {
        row.appendChild(el('td', {}, [scoreCell(player, playerIndex, category)]));
      });
      body.appendChild(row);
    });

    appendTotals(body);
    return body;
  }

  function scoreCell(player, playerIndex, category) {
    var value = player.scores[category.id];
    var filled = Scoring.isFilled(value);
    var key = player.id + ':' + category.id;
    var className = 'cell ' + (filled ? (value === 0 ? 'filled scratched' : 'filled') : 'empty');

    return el('button', withLabel({
      type: 'button',
      class: className,
      'data-focus-key': key,
      text: filled ? String(value) : '',
      onclick: function () { openEntry(playerIndex, category.id); }
    }, player, category.label + ', {name}: ' + (filled ? value + ' points' : 'empty')));
  }

  function renderBonusRow(players, totals) {
    var row = el('tr', { class: 'total-row' });
    row.appendChild(el('th', { class: 'row-head', scope: 'row' }, [
      document.createTextNode('Yahtzee bonus'),
      el('span', { class: 'hint', text: '+' + Scoring.YAHTZEE_BONUS + ' per extra Yahtzee' })
    ]));

    players.forEach(function (player, index) {
      var total = totals[index];
      var count = total.yahtzeeBonusCount;
      var stepper = el('div', { class: 'stepper' }, [
        el('button', withLabel({
          type: 'button',
          class: 'step',
          'data-focus-key': player.id + ':bonus-minus',
          disabled: count === 0 ? '' : null,
          text: '−',
          onclick: function () { changeBonus(index, -1, 'bonus-minus'); }
        }, player, 'One fewer bonus Yahtzee for {name}')),
        el('span', withLabel({
          class: 'bonus-count',
          text: count ? count + '×' + Scoring.YAHTZEE_BONUS : '0'
        }, player, '{name} has ' + count + ' bonus Yahtzees, ' + total.yahtzeeBonusPoints + ' points')),
        el('button', withLabel({
          type: 'button',
          class: 'step',
          'data-focus-key': player.id + ':bonus-plus',
          disabled: count >= Scoring.MAX_YAHTZEE_BONUS ? '' : null,
          text: '+',
          onclick: function () { changeBonus(index, 1, 'bonus-plus'); }
        }, player, 'One more bonus Yahtzee for {name}'))
      ]);
      row.appendChild(el('td', {}, [stepper]));
    });

    return row;
  }

  function refreshProgress() {
    var totals = state.players.map(function (player) { return Scoring.scoreCard(player); });
    renderProgress(totals, Scoring.findLeaders(state.players));
  }

  function renderProgress(totals, leaders) {
    var filled = totals.reduce(function (sum, t) { return sum + t.boxesFilled; }, 0);
    var capacity = totals.length * Scoring.CATEGORIES.length;

    if (!filled) {
      progressLine.textContent = 'Tap a box to start scoring';
      return;
    }

    if (leaders.length) {
      var names = leaders.map(function (i) { return state.players[i].name; });
      var points = totals[leaders[0]].grandTotal + ' points';
      if (totals.length === 1) progressLine.textContent = 'Final score — ' + points;
      else if (leaders.length === 1) progressLine.textContent = 'Final — ' + names[0] + ' wins with ' + points;
      else progressLine.textContent = 'Final — tie between ' + names.join(' & ') + ' at ' + points;
      return;
    }

    var best = -1;
    var bestIndex = [];
    totals.forEach(function (t, index) {
      if (t.grandTotal > best) { best = t.grandTotal; bestIndex = [index]; }
      else if (t.grandTotal === best) bestIndex.push(index);
    });

    var lead = totals.length === 1
      ? best + ' points'
      : (bestIndex.length > 1
        ? 'tied at ' + best
        : state.players[bestIndex[0]].name + ' leads with ' + best);

    progressLine.textContent = filled + ' of ' + capacity + ' boxes · ' + lead;
  }

  /* ---------- score entry ---------- */

  /**
   * Caption under a pickable score. Dice-total boxes get none: the number is
   * the whole story, and repeating the category under all 26 buttons is noise.
   */
  function optionLabel(category, value) {
    if (value === 0) return 'Scratch';
    if (category.section === 'upper') {
      var count = value / category.face;
      return count + (count === 1 ? ' die' : ' dice');
    }
    return category.kind === 'fixed' ? category.label : '';
  }

  function openEntry(playerIndex, categoryId) {
    var player = state.players[playerIndex];
    var category = Scoring.getCategory(categoryId);
    if (!player || !category) return;

    entry = { playerIndex: playerIndex, categoryId: categoryId };
    var current = player.scores[categoryId];

    sheetTitle.textContent = category.label;
    sheetSub.textContent = player.name + ' · ' + category.hint;

    var values = Scoring.validValues(categoryId);
    sheetOptions.textContent = '';
    sheetOptions.className = 'options'
      + (category.kind === 'fixed' ? ' wide' : '')
      + (category.kind === 'sum' ? ' compact' : '');

    // Fixed-score boxes read better as "score it / scratch it", so the real
    // score leads; elsewhere the values stay in their natural order.
    if (category.kind === 'fixed') values = values.slice().reverse();

    values.forEach(function (value) {
      var caption = optionLabel(category, value);
      var classes = 'opt' + (value === 0 ? ' zero' : '') + (value === current ? ' current' : '');
      sheetOptions.appendChild(el('button', {
        type: 'button',
        class: classes,
        'aria-label': value + ' points' + (caption ? ', ' + caption : ''),
        onclick: function () { setScore(playerIndex, categoryId, value); }
      }, [
        document.createTextNode(String(value)),
        caption ? el('span', { class: 'opt-sub', text: caption }) : null
      ]));
    });

    clearButton.disabled = !Scoring.isFilled(current);
    openDialog(sheet);
  }

  function closeEntry() {
    closeDialog(sheet);
    entry = null;
  }

  function setScore(playerIndex, categoryId, value) {
    if (!Scoring.isValidValue(categoryId, value)) return;
    state.players[playerIndex].scores[categoryId] = value;
    focusAfterRender = state.players[playerIndex].id + ':' + categoryId;
    closeEntry();
    commit();
  }

  function clearScore() {
    if (!entry) return;
    var player = state.players[entry.playerIndex];
    delete player.scores[entry.categoryId];
    focusAfterRender = player.id + ':' + entry.categoryId;
    closeEntry();
    commit();
  }

  function changeBonus(playerIndex, delta, focusSuffix) {
    var player = state.players[playerIndex];
    var next = Scoring.scoreCard({ yahtzeeBonus: player.yahtzeeBonus + delta }).yahtzeeBonusCount;
    if (next === player.yahtzeeBonus) return;
    player.yahtzeeBonus = next;
    focusAfterRender = player.id + ':' + focusSuffix;
    commit();
  }

  /* ---------- players & games ---------- */

  function addPlayer() {
    if (state.players.length >= MAX_PLAYERS) return;
    state.players.push(newPlayer('Player ' + (state.players.length + 1)));
    commit();
  }

  function removePlayer(index) {
    var player = state.players[index];
    if (state.players.length <= 1 || !player) return;

    var drop = function () {
      state.players.splice(index, 1);
      commit();
    };

    var played = Scoring.scoreCard(player).boxesFilled > 0 || player.yahtzeeBonus > 0;
    if (!played) return drop();
    askConfirm('Remove ' + player.name + '?', 'Their scores go with them.', 'Remove', drop);
  }

  function newGame() {
    var reset = function () {
      state.players.forEach(function (player) {
        player.scores = {};
        player.yahtzeeBonus = 0;
      });
      commit();
    };

    if (!anyScores()) return reset();
    askConfirm('Start a new game?', 'Scores are cleared. Player names are kept.', 'New game', reset);
  }

  /* ---------- wiring ---------- */

  document.getElementById('add-player').addEventListener('click', addPlayer);
  document.getElementById('new-game').addEventListener('click', newGame);
  clearButton.addEventListener('click', clearScore);

  sheet.addEventListener('click', function (event) {
    if (event.target === sheet) closeEntry();   // tap outside the sheet
  });
  sheet.addEventListener('close', function () { entry = null; });
  sheet.querySelector('[data-close]').addEventListener('click', closeEntry);

  confirmOk.addEventListener('click', function () { resolveConfirm(true); });
  confirmCancel.addEventListener('click', function () { resolveConfirm(false); });
  confirmSheet.addEventListener('close', function () { pendingConfirm = null; });
  confirmSheet.addEventListener('click', function (event) {
    if (event.target === confirmSheet) resolveConfirm(false);
  });
  scrim.addEventListener('click', function () {
    if (confirmSheet.open) resolveConfirm(false);
    else if (sheet.open) closeEntry();
  });

  state = load();
  render();
})();
</script>
</body>
</html>
